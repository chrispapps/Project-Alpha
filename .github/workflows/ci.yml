name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Cache TrustMark models
        uses: actions/cache@v5
        with:
          path: public/trustmark
          key: trustmark-${{ hashFiles('src/lib/trustmark/models.json') }}
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build and run end-to-end tests
        run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
